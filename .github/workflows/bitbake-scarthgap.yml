name: Bitbake (scarthgap)

# Jobs:
#   parse - cheap: parse the layer against OE-Core. Runs everywhere, forks included.
#   dco   - cheap: every PR commit must carry a Signed-off-by line.
#   build - heavy: build the recipe matrix and smoke-test "java -version".
#           Runs only in the upstream repository, never in forks. Pull requests
#           from forks still get it, because PR workflows run in the context of
#           the upstream repository (first-time contributors need approval).

on:
  push:
    branches: [scarthgap]
    paths-ignore: ['**.md', 'LICENSE*']
  pull_request:
    branches: [scarthgap]
    paths-ignore: ['**.md', 'LICENSE*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  OE_CORE_REF: scarthgap
  BITBAKE_REF: "2.8"
  # Same interpreter as the local per-release venv; must satisfy the
  # release's documented minimum host Python.
  PYTHON_VERSION: "3.9"

jobs:
  parse:
    runs-on: ubuntu-24.04
    steps:
      - name: Install software required by OpenEmbedded / Yocto
        run: |
          sudo apt-get update
          sudo apt-get install -y gawk wget git diffstat unzip \
            texinfo gcc build-essential chrpath socat cpio \
            python3 python3-pip python3-pexpect xz-utils \
            debianutils iputils-ping python3-git python3-jinja2 \
            python3-subunit zstd lz4 file locales libacl1
          sudo locale-gen en_US.UTF-8
          # Ubuntu 24.04 restricts unprivileged user namespaces; BitBake needs them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Python modules used by BitBake / OE
        run: pip install GitPython jinja2 pexpect subunit
      - name: Checkout OE-Core
        uses: actions/checkout@v7
        with:
          repository: openembedded/openembedded-core
          ref: ${{ env.OE_CORE_REF }}
          path: oe-core
      - name: Checkout BitBake
        uses: actions/checkout@v7
        with:
          repository: openembedded/bitbake
          ref: ${{ env.BITBAKE_REF }}
          path: oe-core/bitbake
      - name: Checkout this layer
        uses: actions/checkout@v7
        with:
          path: oe-core/meta-openjdk-temurin
      - name: Parse layer
        run: |
          cd oe-core
          source oe-init-build-env build > /dev/null
          bitbake-layers add-layer ../meta-openjdk-temurin
          bitbake -p
          bitbake-layers show-recipes 'openjdk-*'

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on every commit
        run: |
          fail=0
          for c in $(git rev-list --no-merges "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"); do
            if ! git log -1 --format=%B "$c" | grep -q '^Signed-off-by: '; then
              echo "::error::commit $(git log -1 --format='%h %s' "$c") lacks Signed-off-by (use git commit -s)"
              fail=1
            fi
          done
          exit $fail

  build:
    needs: parse
    if: github.repository == 'lucimber/meta-openjdk-temurin'
    strategy:
      matrix:
        recipe: [openjdk-8-jre, openjdk-8-jdk, openjdk-8-jdk-native, openjdk-11-jre, openjdk-17-jre, openjdk-21-jre, openjdk-25-jre]
        machine: [qemuarm, qemuarm64, qemuriscv64, qemux86-64]
        # One scalar per dimension per entry; array values silently exclude nothing.
        exclude:
          - recipe: openjdk-8-jre
            machine: qemuriscv64
          - recipe: openjdk-8-jdk
            machine: qemuriscv64
          # -native builds the same host JDK regardless of MACHINE: build it once.
          - recipe: openjdk-8-jdk-native
            machine: qemuarm
          - recipe: openjdk-8-jdk-native
            machine: qemuarm64
          - recipe: openjdk-8-jdk-native
            machine: qemuriscv64
          - recipe: openjdk-11-jre
            machine: qemuriscv64
          - recipe: openjdk-21-jre
            machine: qemuarm
          - recipe: openjdk-25-jre
            machine: qemuarm
      max-parallel: 3
      fail-fast: false
    runs-on: ubuntu-24.04
    steps:
      - name: Install software required by OpenEmbedded / Yocto
        run: |
          sudo apt-get update
          sudo apt-get install -y gawk wget git diffstat unzip \
            texinfo gcc build-essential chrpath socat cpio \
            python3 python3-pip python3-pexpect xz-utils \
            debianutils iputils-ping python3-git python3-jinja2 \
            python3-subunit zstd lz4 file locales libacl1
          sudo locale-gen en_US.UTF-8
          # Ubuntu 24.04 restricts unprivileged user namespaces; BitBake needs them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Python modules used by BitBake / OE
        run: pip install GitPython jinja2 pexpect subunit
      - name: Checkout OE-Core
        uses: actions/checkout@v7
        with:
          repository: openembedded/openembedded-core
          ref: ${{ env.OE_CORE_REF }}
          path: oe-core
      - name: Checkout BitBake
        uses: actions/checkout@v7
        with:
          repository: openembedded/bitbake
          ref: ${{ env.BITBAKE_REF }}
          path: oe-core/bitbake
      - name: Checkout this layer
        uses: actions/checkout@v7
        with:
          path: oe-core/meta-openjdk-temurin
      - name: Set up build environment
        run: |
          cd oe-core
          source oe-init-build-env build > /dev/null
          cp -v ../meta-openjdk-temurin/.github/workflows/bitbake-scarthgap-local.conf conf/local.conf
          bitbake-layers add-layer ../meta-openjdk-temurin
      - name: Restore sstate cache
        id: sstate
        uses: actions/cache/restore@v6
        with:
          path: oe-core/build/sstate-cache
          key: sstate-scarthgap-${{ matrix.machine }}-${{ github.run_id }}
          restore-keys: sstate-scarthgap-${{ matrix.machine }}-
      - name: Build ${{ matrix.recipe }}
        run: |
          cd oe-core
          source oe-init-build-env build > /dev/null
          MACHINE=${{ matrix.machine }} bitbake ${{ matrix.recipe }}
      - name: Register qemu-user for the target architecture
        if: ${{ !endsWith(matrix.recipe, '-native') && matrix.machine != 'qemux86-64' }}
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64,arm,riscv64
      - name: Smoke test (target) - java -version
        if: ${{ !endsWith(matrix.recipe, '-native') }}
        run: |
          oe-core/meta-openjdk-temurin/.github/scripts/smoke-java-version.sh \
            oe-core/build/tmp*/deploy/ipk ${{ matrix.recipe }} ${{ matrix.machine }}
      - name: Smoke test (native) - java -version
        if: ${{ endsWith(matrix.recipe, '-native') }}
        run: |
          cd oe-core
          source oe-init-build-env build > /dev/null
          MACHINE=${{ matrix.machine }} bitbake ${{ matrix.recipe }} -c addto_recipe_sysroot
          MACHINE=${{ matrix.machine }} oe-run-native ${{ matrix.recipe }} java -version
      - name: Save sstate cache
        if: github.event_name == 'push' && always() && steps.sstate.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: oe-core/build/sstate-cache
          key: sstate-scarthgap-${{ matrix.machine }}-${{ github.run_id }}
