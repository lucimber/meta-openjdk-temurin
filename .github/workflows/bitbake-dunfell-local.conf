CONF_VERSION = "1"

PACKAGE_CLASSES = "package_ipk"
PATCHRESOLVE = "noop"

BB_DISKMON_DIRS ??= "\
    STOPTASKS,${TMPDIR},1G,100K \
    STOPTASKS,${DL_DIR},1G,100K \
    STOPTASKS,${SSTATE_DIR},1G,100K \
    STOPTASKS,/tmp,100M,100K \
    ABORT,${TMPDIR},100M,1K \
    ABORT,${DL_DIR},100M,1K \
    ABORT,${SSTATE_DIR},100M,1K \
    ABORT,/tmp,10M,1K"

# Fetch sources from the Yocto Project source mirror first. Upstream sites
# move or drop release tarballs (e.g. zlib.net only keeps the latest
# release), which otherwise breaks CI with checksum or 404 errors.
PREMIRRORS_prepend = "\
    https?://.*/.* http://downloads.yoctoproject.org/mirror/sources/ \
    ftp://.*/.*    http://downloads.yoctoproject.org/mirror/sources/ \
"
