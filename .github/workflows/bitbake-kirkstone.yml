name: Bitbake (kirkstone)
on:
  push:
    branches:
      - kirkstone
  pull_request:
    branches:
      - kirkstone
jobs:
  build:
    strategy:
      matrix:
        recipe: [openjdk-8-jre, openjdk-8-jdk, openjdk-8-jdk-native, openjdk-11-jre, openjdk-17-jre, openjdk-21-jre, openjdk-25-jre]
        machine: [qemuarm, qemuarm64, qemuriscv64, qemux86-64]
        exclude:
          - recipe: openjdk-8-jre
            machine: qemuriscv64
          - recipe: openjdk-8-jdk
            machine: qemuriscv64
          - recipe: openjdk-8-jdk-native
            machine: qemuriscv64
          - recipe: openjdk-11-jre
            machine: qemuriscv64
          - recipe: openjdk-21-jre
            machine: qemuarm
          - recipe: openjdk-25-jre
            machine: qemuarm
      max-parallel: 3
      fail-fast: false
    runs-on: ubuntu-22.04
    steps:
      - name: Install software required by OpenEmbedded / Yocto
        run: |
          sudo apt-get update
          sudo apt-get install gawk wget git diffstat unzip \
            texinfo gcc build-essential chrpath socat cpio \
            python3 python3-pip python3-pexpect xz-utils \
            debianutils iputils-ping python3-git python3-jinja2 \
            python3-subunit zstd liblz4-tool file locales libacl1
          sudo locale-gen en_US.UTF-8
      - name: Checkout OE-Core
        uses: actions/checkout@v4
        with:
          repository: openembedded/openembedded-core
          ref: kirkstone
          path: oe-core
      - name: Checkout Bitbake
        uses: actions/checkout@v4
        with:
          repository: openembedded/bitbake
          ref: '2.0'
          path: oe-core/bitbake
      - name: Checkout sources of this project
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          path: oe-core/meta-openjdk-temurin
      - name: Replace config of build-environment
        run: |
          cd oe-core
          source oe-init-build-env build > /dev/null 2>&1
          mv -v ../meta-openjdk-temurin/.github/workflows/bitbake-kirkstone-local.conf \
            conf/local.conf
      - name: Add layer to build-environment
        run: |
          cd oe-core
          source oe-init-build-env build > /dev/null 2>&1
          bitbake-layers add-layer ../meta-openjdk-temurin
      - name: Restore cached sstate of Bitbake
        id: cache-bitbake-sstate-restore
        uses: actions/cache/restore@v4
        with:
          path: oe-core/build/sstate-cache
          key: bitbake-sstate_kirkstone_${{ matrix.machine }}
      - name: Build ${{ matrix.recipe }} with Bitbake
        run: |
          cd oe-core
          source oe-init-build-env build > /dev/null 2>&1
          MACHINE=${{ matrix.machine }} bitbake ${{ matrix.recipe }}
      - name: Register qemu-user handlers for non-native archs
        if: contains(matrix.recipe, '-jre') && matrix.machine != 'qemux86-64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,arm,riscv64
      - name: Smoke test — java -version
        if: contains(matrix.recipe, '-jre')
        run: |
          set -euo pipefail

          # Locate the primary ipk (exclude -dbg / -dev / -doc splits).
          ipk=$(find oe-core/build/tmp*/deploy/ipk \
                  -name "${{ matrix.recipe }}_*.ipk" \
                  ! -name '*-dbg*' ! -name '*-dev*' ! -name '*-doc*' \
                  | head -1)
          [ -n "$ipk" ] || { echo "error: no ipk produced for ${{ matrix.recipe }}"; exit 1; }

          # Extract the ipk (ar archive containing data.tar.*) into a sysroot.
          work=$(mktemp -d)
          ( cd "$work" && ar x "$ipk" && tar xf data.tar.* )

          # Map the OE MACHINE to the Docker --platform qemu-user emulates.
          case "${{ matrix.machine }}" in
            qemux86-64)  plat=linux/amd64   ;;
            qemuarm64)   plat=linux/arm64   ;;
            qemuarm)     plat=linux/arm/v7  ;;
            qemuriscv64) plat=linux/riscv64 ;;
            *) echo "error: unknown machine ${{ matrix.machine }}"; exit 1 ;;
          esac

          # Run the extracted java under a target-arch glibc. The Temurin
          # binary's ELF interpreter is patched to ${base_libdir}/ld-linux-*,
          # which under usrmerge-enabled OE distros is /usr/lib/ld-linux-*.
          # Debian trixie keeps the real file under a multiarch triplet path,
          # so we create a compat symlink at /usr/lib/ld-linux-* (and /lib/
          # for belt-and-braces) before invoking java.
          docker run --rm --platform "$plat" \
            -v "$work:/rootfs:ro" \
            debian:trixie-slim \
            sh -ec '
              set -eu
              for real in /lib/*/ld-linux-* /lib64/ld-linux-* /usr/lib/*/ld-linux-*; do
                [ -f "$real" ] || continue
                base=$(basename "$real")
                [ -e "/usr/lib/$base" ] || ln -sf "$real" "/usr/lib/$base"
                [ -e "/lib/$base" ]     || ln -sf "$real" "/lib/$base"
              done
              java=$(find /rootfs/usr/lib/jvm -name java -type f -executable | head -1)
              [ -n "$java" ] || { echo "error: no java binary in extracted ipk"; exit 1; }
              "$java" -version
            '
      - name: Save sstate of Bitbake
        id: cache-bitbake-sstate-save
        if: steps.cache-bitbake-sstate-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: oe-core/build/sstate-cache
          key: ${{ steps.cache-bitbake-sstate-restore.outputs.cache-primary-key }}
