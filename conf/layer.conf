# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-openjdk-temurin"
BBFILE_PATTERN_meta-openjdk-temurin = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-openjdk-temurin = "6"

LAYERDEPENDS_meta-openjdk-temurin = "core"
LAYERSERIES_COMPAT_meta-openjdk-temurin = "dunfell gatesgarth hardknott honister"

# This branch of meta-openjdk-temurin is obsolete and no longer maintained.
# Yocto Dunfell (3.1) reached community-extended EOL in April 2024.
# Migrate to a supported branch: kirkstone (4.x), scarthgap (5.x), or main (6.x).
python () {
    bb.warn("meta-openjdk-temurin: the 'dunfell' branch is obsolete and unmaintained. "
            "No further fixes will be backported. "
            "Migrate to kirkstone, scarthgap, or main.")
}
